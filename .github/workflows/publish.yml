name: Publish

# Publishes the SDK to PyPI when a version tag (e.g. v1.2.3) is pushed.
# Authentication uses PyPI Trusted Publishing (OIDC) — no long-lived API token is stored.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for GitHub to issue the OIDC token PyPI exchanges
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pin the package version to the tag (refs/tags/v1.2.3 -> 1.2.3) so the artifact matches the release.
      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"${version}\"/" pyproject.toml

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      # No token: the action exchanges the OIDC token and uploads to PyPI.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
